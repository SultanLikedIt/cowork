server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to 50 MB (default nginx limit is 1 MB, causing 413s).
    client_max_body_size 50m;

    # Static SPA assets.
    location / {
        try_files $uri /index.html;
    }

    # Mirrors frontend/vite.config.js's dev proxy: strip the /api prefix
    # and forward to the backend, which mounts its routes at root
    # (/run-pipeline, /jobs, /workers, /workspaces, /upload, ...).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # backend/main.py serves SSE (text/event-stream) on
        # /jobs/{job_id}/events -- buffering would delay/batch those
        # events instead of streaming them as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
