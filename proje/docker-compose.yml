services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64  # matches the manylinux/x86_64 offline wheel bundle
    # Crawl4AI runs a real headless Chromium; Docker's default 64MB /dev/shm
    # is a known cause of Chromium crashing under memory pressure. Also
    # passing --disable-dev-shm-usage to the browser itself (crawl4ai_engine.py)
    # as a second layer of the same fix.
    shm_size: 1gb
    environment:
      # Model backend config -- see backend/model_config.py. No defaults are
      # hardcoded here on purpose; set these in a .env file next to this
      # compose file (or in the shell environment) before `docker compose up`.
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      # camel (default) | langgraph — see docs/langgraph-migration.md
      AGENT_EXECUTOR: ${AGENT_EXECUTOR:-camel}
      # backend/web_search.py calls this over the Docker network -- the
      # "searxng" hostname resolves via Compose's default network, no port
      # publishing needed. See searxng/settings.yml for the JSON API config.
      SEARXNG_BASE_URL: http://searxng:8080
      # Optional AgentSearch sidecar (brcrusoe72/agent-search). When enabled,
      # web_search blends it into SearXNG's results (docs/agent-search.md).
      AGENT_SEARCH_ENABLED: ${AGENT_SEARCH_ENABLED:-true}
      AGENT_SEARCH_BASE_URL: ${AGENT_SEARCH_BASE_URL:-http://agent-search:3939}
      AGENT_SEARCH_TOKEN: ${AGENT_SEARCH_TOKEN:-}
      AGENT_SEARCH_TIMEOUT_SECONDS: ${AGENT_SEARCH_TIMEOUT_SECONDS:-20}
      # SearXNG and AgentSearch requests start together; AgentSearch only
      # gets this long past SearXNG before its results are left out.
      AGENT_SEARCH_GRACE_SECONDS: ${AGENT_SEARCH_GRACE_SECONDS:-1.5}
      # AgentSearch for general searches: off (default; its general mode
      # re-asks SearXNG's own engines) | reference | general (old behavior).
      # News searches use AgentSearch either way.
      AGENT_SEARCH_GENERAL_MODE: ${AGENT_SEARCH_GENERAL_MODE:-off}
      # Crawl4AI (self-hosted Playwright/Chromium) is the only active web
      # engine. SearXNG / AgentSearch remain discovery-only; page open is
      # still web_read → Crawl4AI.
      WEB_REQUEST_TIMEOUT_SECONDS: ${WEB_REQUEST_TIMEOUT_SECONDS:-15}
      WEB_ACQUIRE_TIMEOUT_SECONDS: ${WEB_ACQUIRE_TIMEOUT_SECONDS:-15}
      WEB_MAX_RESPONSE_BYTES: ${WEB_MAX_RESPONSE_BYTES:-5242880}
      WEB_MAX_REDIRECTS: ${WEB_MAX_REDIRECTS:-5}
      WEB_MAX_CRAWL_DEPTH: ${WEB_MAX_CRAWL_DEPTH:-1}
      WEB_MAX_CRAWL_PAGES: ${WEB_MAX_CRAWL_PAGES:-3}
      WEB_MAX_CONCURRENT_REQUESTS: ${WEB_MAX_CONCURRENT_REQUESTS:-8}
      WEB_MAX_CONCURRENT_ACQUISITIONS: ${WEB_MAX_CONCURRENT_ACQUISITIONS:-4}
      WEB_MAX_RETRIES: ${WEB_MAX_RETRIES:-1}
      # A fetch round stops waiting on slow pages once others loaded
      # (web_controller._gather_until_enough).
      WEB_FETCH_ENOUGH_SUCCESSES: ${WEB_FETCH_ENOUGH_SUCCESSES:-2}
      WEB_FETCH_STRAGGLER_GRACE_SECONDS: ${WEB_FETCH_STRAGGLER_GRACE_SECONDS:-6}
      WEB_FETCH_SETTLE_GRACE_SECONDS: ${WEB_FETCH_SETTLE_GRACE_SECONDS:-1.5}
      # Uploaded documents are parsed internally by Docling. With OCR on and
      # OCR_ENGINE=paddleocr_vl (default), images and PDF pages without a
      # text layer go to the PaddleOCR-VL service below (layout + tables by
      # PaddleOCR-VL-1.6 on the GPU) and come back as a DoclingDocument; PDF
      # pages with a text layer keep Docling's exact native text. If that
      # service is not running (profile "paddleocr" off, no GPU) or fails,
      # the same upload is parsed by Docling + OCR_FALLBACK_ENGINE instead:
      # Tesseract (installed in the image, Turkish + English), which only
      # OCRs bitmap regions. OCR costs seconds per page, hence the longer
      # parse timeout; keep PADDLEOCR_VL_TIMEOUT_SECONDS below it so a slow
      # service still leaves time for the fallback.
      OCR_ENGINE: ${OCR_ENGINE:-paddleocr_vl}
      OCR_FALLBACK_ENGINE: ${OCR_FALLBACK_ENGINE:-tesseract}
      PADDLEOCR_VL_URL: ${PADDLEOCR_VL_URL:-http://paddleocr-vl-api:8080}
      PADDLEOCR_VL_TIMEOUT_SECONDS: ${PADDLEOCR_VL_TIMEOUT_SECONDS:-240}
      PADDLEOCR_VL_ORIENTATION: ${PADDLEOCR_VL_ORIENTATION:-true}
      PADDLEOCR_VL_UNWARPING: ${PADDLEOCR_VL_UNWARPING:-false}
      DOCLING_PARSE_TIMEOUT_SECONDS: ${DOCLING_PARSE_TIMEOUT_SECONDS:-300}
      DOCLING_MAX_FILE_BYTES: ${DOCLING_MAX_FILE_BYTES:-20971520}
      DOCLING_MAX_PAGES: ${DOCLING_MAX_PAGES:-500}
      DOCLING_MAX_TABLES: ${DOCLING_MAX_TABLES:-100}
      DOCLING_MAX_CHUNKS: ${DOCLING_MAX_CHUNKS:-10000}
      DOCLING_ENABLE_OCR: ${DOCLING_ENABLE_OCR:-true}
      # Languages for the Docling OCR engine (the fallback when OCR_ENGINE is
      # paddleocr_vl), in that engine's own codes. PaddleOCR-VL takes none.
      OCR_LANGS: ${OCR_LANGS:-tur,eng}
      OCR_FORCE_FULL_PAGE: ${OCR_FORCE_FULL_PAGE:-false}
      DOCLING_ARTIFACTS_PATH: /app/vendor/docling-models
      # In-process BGE cross-encoder that replaces the LLM URL-selection call
      # per search round (backend/reranker.py). Loaded once per backend
      # process (~2.5GB RAM); missing weights fall back to LLM selection.
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RERANKER_MODEL_PATH: /app/vendor/bge-reranker-v2-m3
      RERANKER_THREADS: ${RERANKER_THREADS:-4}
      # Narrative PDF/DOCX: Document LLM returns typed blocks (heading,
      # paragraph, list, table, quote) instead of free markdown -- see
      # backend/document_model.py. On, every narrative PDF/DOCX calls the
      # Document LLM. false = the previous markdown path, unchanged.
      DOCUMENT_BLOCKS: ${DOCUMENT_BLOCKS:-true}
      # How typed-block PDFs are drawn: chromium = HTML/CSS printed by the
      # Playwright Chromium already in this image (backend/document_html.py);
      # reportlab = the previous renderer. Chromium falls back to reportlab
      # on any failure.
      DOCUMENT_PDF_ENGINE: ${DOCUMENT_PDF_ENGINE:-chromium}
      DOCUMENT_PDF_TIMEOUT_SECONDS: ${DOCUMENT_PDF_TIMEOUT_SECONDS:-45}
      # OpenRouter options for the Document LLM call only (execution/
      # langgraph_runtime/workforce.py: _document_llm_extra_body). Empty =
      # provider defaults. EFFORT: low|medium|high. SORT: throughput|latency|price.
      # Leave empty for deepseek-v4-flash: measured, "low" turns ON reasoning
      # the model otherwise skips (2-3x slower) and "throughput" gained nothing.
      DOCUMENT_LLM_REASONING_EFFORT: ${DOCUMENT_LLM_REASONING_EFFORT:-}
      DOCUMENT_LLM_PROVIDER_SORT: ${DOCUMENT_LLM_PROVIDER_SORT:-}
      # OpenBot remote-ag-ui bridge (POST /ag-ui, GET /health on the backend port).
      OPENBOT_AGUI_ENABLED: ${OPENBOT_AGUI_ENABLED:-false}
      OPENBOT_AGUI_TOKEN: ${OPENBOT_AGUI_TOKEN:-}
      # Lets the agent open a just-created file in its default app on the
      # user's OWN computer (not this container) -- requires
      # scripts/local_computer_bridge.py running natively on that same
      # machine. Same-machine only: host.docker.internal always resolves to
      # whichever machine runs these containers, never a different browser
      # client. See backend/local_computer.py and docs/local-computer.md.
      # Scheduled and watch tasks (backend/scheduling/, docs/scheduling.md).
      # The loop runs inside this process; state lives in the /data database.
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-true}
      SCHEDULE_TICK_SECONDS: ${SCHEDULE_TICK_SECONDS:-30}
      SCHEDULE_MAX_CONCURRENT: ${SCHEDULE_MAX_CONCURRENT:-2}
      SCHEDULE_CATCHUP_WINDOW_HOURS: ${SCHEDULE_CATCHUP_WINDOW_HOURS:-6}
      SCHEDULE_MAX_TASKS_PER_WORKSPACE: ${SCHEDULE_MAX_TASKS_PER_WORKSPACE:-20}
      SCHEDULE_MIN_INTERVAL_MINUTES: ${SCHEDULE_MIN_INTERVAL_MINUTES:-60}
      SCHEDULE_MIN_DEEP_INTERVAL_HOURS: ${SCHEDULE_MIN_DEEP_INTERVAL_HOURS:-24}
      SCHEDULE_MAX_CONSECUTIVE_FAILURES: ${SCHEDULE_MAX_CONSECUTIVE_FAILURES:-3}
      SCHEDULE_DEFAULT_TIMEZONE: ${SCHEDULE_DEFAULT_TIMEZONE:-Europe/Istanbul}
      LOCAL_COMPUTER_ENABLED: ${LOCAL_COMPUTER_ENABLED:-false}
      LOCAL_COMPUTER_URL: ${LOCAL_COMPUTER_URL:-http://host.docker.internal:8765}
    volumes:
      - backend-data:/data
    # Host ports differ from the Camel stack (8000/8080) so both can run
    # side-by-side without colliding. In-container ports stay the same.
    ports:
    - "8001:8000"
    depends_on:
      - searxng
      - agent-search
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    expose:
      - "8080"
    restart: unless-stopped

  # brcrusoe72/agent-search — scored multi-engine search API over our SearXNG.
  # Submodule: vendor/agent-search (git submodule update --init).
  agent-search:
    build:
      context: ./vendor/agent-search
      dockerfile: Dockerfile
    environment:
      SEARXNG_URL: http://searxng:8080
      CACHE_TTL: ${AGENT_SEARCH_CACHE_TTL:-3600}
      RATE_LIMIT: ${AGENT_SEARCH_RATE_LIMIT:-60}
      AGENT_SEARCH_TOKEN: ${AGENT_SEARCH_TOKEN:-}
    ports:
      - "3939:3939"
    depends_on:
      - searxng
    volumes:
      - agent-search-data:/app/data
    restart: unless-stopped

  # PaddleOCR-VL OCR stack -- opt-in with the "paddleocr" profile
  # (COMPOSE_PROFILES=paddleocr in .env, or `docker compose --profile
  # paddleocr up`). Needs an NVIDIA GPU with compute capability >= 8.0 and a
  # driver recent enough for the vLLM image's CUDA. Without it the backend
  # falls back to Tesseract. See docs/document-ingestion.md.
  #
  # Pipeline API: layout detection (CPU) + orchestration, POST /layout-parsing.
  # Built locally from PyPI/Hugging Face -- Baidu's prebuilt images are not
  # reachable from our network (see paddleocr-vl/Dockerfile).
  paddleocr-vl-api:
    profiles: ["paddleocr"]
    build:
      context: ./paddleocr-vl
      dockerfile: Dockerfile
    expose:
      - "8080"
    # Mounted over the copy baked into the image, so a pipeline config change
    # only needs `docker compose up -d paddleocr-vl-api`, not a rebuild.
    volumes:
      - ./paddleocr-vl/pipeline_config.yaml:/app/pipeline_config.yaml:ro
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      start_period: 120s
    restart: unless-stopped

  # PaddleOCR-VL-1.6 itself, served by vLLM on the GPU. Weights come from
  # Hugging Face on first start (~2 GB) and persist in paddleocr-hf-cache.
  # --served-model-name must match VLRecognition.model_name in
  # paddleocr-vl/pipeline_config.yaml.
  paddleocr-vlm-server:
    profiles: ["paddleocr"]
    image: vllm/vllm-openai:${PADDLEOCR_VLLM_IMAGE_TAG:-v0.29.0}
    command:
      - PaddlePaddle/PaddleOCR-VL-1.6
      - --served-model-name
      - PaddleOCR-VL-1.6-0.9B
      - --host
      - 0.0.0.0
      - --port
      - "8118"
      - --trust-remote-code
      # Share of the GPU vLLM reserves (weights + KV cache). 0.6 of an 8 GB
      # card leaves room for the desktop; PaddleX's own default is 0.5.
      - --gpu-memory-utilization
      - ${PADDLEOCR_VLM_GPU_MEMORY_UTILIZATION:-0.6}
      - --max-model-len
      - "16384"
      - --max-num-batched-tokens
      - "16384"
      # Same WSL limitation as VLLM_USE_V2_MODEL_RUNNER below: async
      # scheduling does non-blocking host->GPU copies that assume pinned
      # memory, and under WSL the first real request killed the engine with
      # "torch.AcceleratorError: CUDA error: unknown error"
      # (synchronize_input_prep). Remove on native Linux for more throughput.
      - --no-async-scheduling
    environment:
      # vLLM's default V2 model runner needs pinned (UVA) host memory, and
      # vLLM reports none under WSL -- i.e. Docker Desktop on Windows. There
      # it crash-loops at startup with "RuntimeError: UVA is not available".
      # The V1 runner works without it. On native Linux hosts you can set
      # this back to 1 (or unset it).
      VLLM_USE_V2_MODEL_RUNNER: ${PADDLEOCR_VLLM_USE_V2_MODEL_RUNNER:-0}
    expose:
      - "8118"
    volumes:
      - paddleocr-hf-cache:/root/.cache/huggingface
    shm_size: 4gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8118/health')\""]
      interval: 30s
      # First start downloads the weights and compiles CUDA graphs.
      start_period: 900s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  backend-data:
  agent-search-data:
  paddleocr-hf-cache:
